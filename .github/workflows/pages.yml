# Publishes progress.hiddencreekreserve.com with photos as separate files
# (see tools/web_build.py). Runs on every push to main, including the
# weekday refreshes. Needs Settings > Pages > Source set to "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # photo upload dates come from git history
          filter: blob:none     # ...but old file contents are not needed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow pillow-heif
      - uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('photos/**') }}
          restore-keys: photos-
      - run: python3 tools/web_build.py index.html _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
