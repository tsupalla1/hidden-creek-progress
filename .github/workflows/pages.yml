# Publishes progress.hiddencreekreserve.com with photos as separate files
# (see tools/web_build.py). Runs on every push to main, including the
# weekday refreshes. Needs Settings > Pages > Source set to "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # photo upload dates come from git history
          filter: blob:none     # ...but old file contents are not needed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow pillow-heif
      - uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('photos/**') }}
          restore-keys: photos-
      - run: python3 tools/web_build.py index.html _site
      # Guard the speed gain: stop before publishing if the page balloons again
      # (the live site then stays on its last good version and GitHub emails a failed run)
      - name: Check page size
        run: |
          size=$(stat -c %s _site/index.html)
          echo "index.html is $((size / 1024)) KB"
          if grep -q 'data:image/webp;base64' _site/index.html; then
            echo "::error::Photos are packed inside the website page again (they should be files in p/)"; exit 1
          fi
          if [ "$size" -gt 768000 ]; then
            echo "::error::index.html is $((size / 1024)) KB, expected about 300 KB"; exit 1
          elif [ "$size" -gt 450000 ]; then
            echo "::warning::index.html grew to $((size / 1024)) KB (it was about 300 KB)"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
